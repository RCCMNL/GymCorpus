name: gym_corpus
description: "A new Flutter project for GYM 2.0"
publish_to: 'none'

version: 1.0.0+1

environment:
  # Da 3.7 in poi `dart format` usa lo stile "tall", che dispone un argomento
  # per riga e mantiene le virgole finali. Con la versione di linguaggio
  # precedente il formattatore rimuoveva le virgole che `dart fix` aggiungeva
  # per soddisfare require_trailing_commas, e i due strumenti si annullavano.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.2.0
  dartz: ^0.10.1
  device_info_plus: ^12.4.0
  drift: ^2.14.0
  equatable: ^2.0.5
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.9
  freezed_annotation: any
  geolocator: ^13.0.1
  get_it: ^7.6.4
  go_router: ^12.1.1
  google_sign_in: 7.1.0
  health: ^13.3.1
  image_picker: ^1.2.1
  injectable: any
  intl: ^0.20.2
  latlong2: ^0.9.1
  local_auth: 2.3.0
  package_info_plus: ^8.0.0
  path: ^1.8.3
  path_provider: ^2.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  sign_in_with_apple: ^7.0.1
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.9.4
  timezone: ^0.9.4
  url_launcher: ^6.3.0

dev_dependencies:
  alchemist: ^0.3.0
  bloc_test: ^9.1.5
  build_runner: ^2.4.6
  drift_dev: ^2.14.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: any
  injectable_generator: any
  mocktail: ^1.0.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Le figure degli esercizi, una per esercizio: il nome del file si
    # ricava dal nome dell'esercizio, vedi assets/exercises/LEGGIMI.md.
    - assets/exercises/
    # Solo i due file di licenza, non l'intera cartella fonts/: i .ttf
    # sono gia' impacchettati dalla sezione fonts: qui sotto, e
    # dichiararli anche come asset li includerebbe due volte.
    - assets/fonts/Lexend-OFL.txt
    - assets/fonts/Inter-OFL.txt

  # Lexend e Inter erano usati in tutto il tema (fontFamily: 'Lexend' in
  # 65 file) ma non erano mai stati dichiarati: Flutter ripiegava in
  # silenzio sul font di sistema, quindi la tipografia progettata non si
  # e' mai vista. Impacchettati invece di scaricarli a runtime, cosi'
  # l'app resta identica anche senza rete.
  #
  # I pesi sono quelli davvero usati nel codice. Inter e' incluso solo a
  # 400/600/700 perche' ogni suo file pesa ~318 KB (contro i 69 KB di
  # Lexend): il 500 ricade sul peso piu' vicino, differenza impercettibile
  # nel testo di lettura.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lexend-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#08082f"
  image: "assets/images/splash_native.png"
  android_12:
    color: "#08082f"
    image: "assets/images/splash_android12_icon.png"
  web: false
